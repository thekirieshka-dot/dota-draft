<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Shadow Arena</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

button{
    font:inherit;
    color:inherit;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 30%,#18202a 0,#080a0e 45%,#030406 100%);
}

/* =========================
   COMMON
========================= */

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

.glass{
    background:rgba(8,11,16,.78);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:
      0 20px 60px rgba(0,0,0,.55),
      inset 0 1px rgba(255,255,255,.04);
    backdrop-filter:blur(16px);
}

.primary{
    border:0;
    cursor:pointer;
    padding:15px 28px;
    border-radius:12px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    background:linear-gradient(135deg,#fff,#aeb8c7);
    color:#050608;
    box-shadow:0 10px 30px rgba(255,255,255,.12);
    transition:.2s;
}

.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(255,255,255,.2);
}

.primary:active{
    transform:scale(.97);
}

.small-btn{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

/* =========================
   MENU
========================= */

#menu{
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
}

.city{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.85;
}

.city:before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:31%;
    height:32%;
    background:
      linear-gradient(to top,rgba(0,0,0,.98),transparent),
      repeating-linear-gradient(
        90deg,
        #111821 0 55px,
        #090d12 55px 100px,
        #151d26 100px 125px
      );
    clip-path:polygon(
      0 100%,0 45%,5% 45%,5% 25%,10% 25%,10% 50%,
      15% 50%,15% 18%,21% 18%,21% 40%,28% 40%,28% 8%,
      34% 8%,34% 47%,41% 47%,41% 23%,48% 23%,48% 42%,
      55% 42%,55% 13%,62% 13%,62% 37%,68% 37%,68% 5%,
      74% 5%,74% 35%,82% 35%,82% 17%,88% 17%,88% 45%,
      94% 45%,94% 28%,100% 28%,100% 100%
    );
}

.city:after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 15% 20%,rgba(255,255,255,.08) 0 1px,transparent 2px),
      radial-gradient(circle at 80% 12%,rgba(255,255,255,.06) 0 1px,transparent 2px),
      linear-gradient(to bottom,rgba(7,10,14,.05),#050608 82%);
}

.menu-content{
    position:relative;
    z-index:2;
    width:min(800px,92vw);
}

.logo{
    font-size:clamp(48px,9vw,100px);
    font-weight:1000;
    letter-spacing:-5px;
    text-shadow:
      0 0 25px rgba(255,255,255,.15),
      0 0 80px rgba(110,180,255,.12);
}

.logo span{
    color:#7d8b9c;
}

.subtitle{
    color:#82909f;
    letter-spacing:5px;
    text-transform:uppercase;
    margin:8px 0 45px;
}

.menu-buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

/* =========================
   DIFFICULTY
========================= */

#difficulty{
    align-items:center;
    justify-content:center;
}

.diff-box{
    width:min(720px,94vw);
    padding:30px;
    border-radius:20px;
}

.diff-title{
    font-size:34px;
    font-weight:1000;
    margin-bottom:8px;
}

.diff-sub{
    color:#82909f;
    margin-bottom:25px;
}

.diff-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.diff{
    padding:25px 15px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.diff:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.3);
}

.diff b{
    display:block;
    font-size:18px;
    margin-bottom:7px;
}

.diff span{
    color:#7d8997;
    font-size:13px;
}

/* =========================
   DRAFT
========================= */

#draft{
    flex-direction:column;
    background:
      radial-gradient(circle at 50% 0,rgba(75,110,150,.12),transparent 45%),
      #050608;
}

.draft-top{
    height:92px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(3,5,8,.85);
    z-index:5;
}

.team{
    width:230px;
}

.team-name{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:#7c8997;
}

.team-picks{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.pick-mini{
    width:34px;
    height:34px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.12);
    display:grid;
    place-items:center;
    font-size:10px;
    color:#777;
    background:#0c1015;
    overflow:hidden;
}

.pick-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.pick-mini.selected{
    border-color:#fff;
}

.draft-phase{
    text-align:center;
}

.phase-label{
    color:#8c98a5;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:3px;
}

.phase-value{
    font-size:20px;
    font-weight:900;
    margin-top:4px;
}

.draft-body{
    flex:1;
    display:flex;
    min-height:0;
}

.fighters{
    flex:1;
    padding:18px;
    overflow:auto;
}

.fighter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
    gap:10px;
    max-width:1300px;
    margin:auto;
}

.fighter-card{
    position:relative;
    min-height:165px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.4)),
      #0a0d11;
    overflow:hidden;
    cursor:pointer;
    transition:.18s;
}

.fighter-card:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.3);
}

.fighter-card.disabled{
    opacity:.18;
    filter:grayscale(1);
    cursor:not-allowed;
}

.fighter-card.banned{
    opacity:.2;
    filter:grayscale(1);
}

.fighter-card.picked{
    outline:2px solid #fff;
}

.fighter-visual{
    position:absolute;
    inset:0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 65%,var(--c),transparent 45%);
}

.shadow-man{
    width:52px;
    height:92px;
    position:relative;
    filter:drop-shadow(0 0 12px var(--c));
}

.shadow-man:before{
    content:"";
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#030303;
    top:0;
    left:11px;
    box-shadow:0 0 10px rgba(255,255,255,.05);
}

.shadow-man:after{
    content:"";
    position:absolute;
    width:44px;
    height:62px;
    border-radius:45% 45% 18% 18%;
    background:#030303;
    left:4px;
    top:25px;
    box-shadow:
      -18px 28px 0 -12px #030303,
      18px 28px 0 -12px #030303;
}

.fighter-info{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:8px;
    background:linear-gradient(transparent,#050608 35%);
}

.fighter-name{
    font-weight:900;
    font-size:13px;
}

.fighter-role{
    color:#737f8c;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-mark{
    position:absolute;
    top:7px;
    right:7px;
    font-size:10px;
    font-weight:900;
}

.draft-side{
    width:280px;
    border-left:1px solid rgba(255,255,255,.07);
    padding:18px;
    background:rgba(0,0,0,.2);
}

.ban-title{
    color:#7f8b99;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.ban-count{
    margin:7px 0 12px;
    font-size:26px;
    font-weight:1000;
}

.ban-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
}

.ban-slot{
    aspect-ratio:1;
    border-radius:7px;
    background:#0a0d11;
    border:1px solid rgba(255,255,255,.07);
    display:grid;
    place-items:center;
    color:#39414b;
    font-size:11px;
    overflow:hidden;
}

.ban-slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(1);
}

.draft-footer{
    min-height:72px;
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:10px;
}

#confirmDraft{
    display:none;
}

/* =========================
   ARENA
========================= */

#arena{
    flex-direction:column;
    background:#050608;
}

.arena{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
      linear-gradient(to bottom,rgba(7,10,14,.1),rgba(3,5,6,.8)),
      radial-gradient(ellipse at 50% 40%,#26333a 0,#10161a 40%,#050708 75%);
}

.sky{
    position:absolute;
    inset:0 0 45%;
    background:
      radial-gradient(circle at 20% 25%,rgba(160,180,190,.12),transparent 18%),
      radial-gradient(circle at 80% 30%,rgba(100,130,150,.1),transparent 25%),
      linear-gradient(#0b1116,#151d22 65%,#0b1012);
}

.arena-city{
    position:absolute;
    left:0;
    right:0;
    bottom:39%;
    height:35%;
    opacity:.65;
}

.arena-city:before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        90deg,
        #0a0d10 0 50px,
        #11171b 50px 82px,
        #080b0e 82px 125px
      );
    clip-path:polygon(
      0 100%,0 55%,4% 55%,4% 25%,9% 25%,9% 45%,
      15% 45%,15% 15%,20% 15%,20% 52%,26% 52%,26% 30%,
      31% 30%,31% 8%,36% 8%,36% 47%,42% 47%,42% 21%,
      48% 21%,48% 42%,55% 42%,55% 5%,61% 5%,61% 34%,
      67% 34%,67% 15%,73% 15%,73% 45%,79% 45%,79% 23%,
      86% 23%,86% 48%,92% 48%,92% 13%,100% 13%,100% 100%
    );
}

.ground{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-5%;
    height:48%;
    background:
      radial-gradient(ellipse at 50% 10%,rgba(80,120,68,.32),transparent 45%),
      linear-gradient(#101c12,#071008);
    transform:perspective(500px) rotateX(38deg);
    transform-origin:bottom;
}

.ground-lines{
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(90deg,transparent 0 90px,rgba(95,130,80,.08) 91px 92px),
      repeating-linear-gradient(0deg,transparent 0 50px,rgba(95,130,80,.06) 51px 52px);
    transform:perspective(300px) rotateX(45deg);
}

.fog{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 65%,transparent 0 25%,rgba(5,7,8,.45) 75%);
    pointer-events:none;
}

.arena-hud{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.health{
    width:min(330px,35vw);
}

.hp-top{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-weight:900;
    margin-bottom:5px;
}

.hp-bar{
    height:12px;
    background:#080b0d;
    border:1px solid rgba(255,255,255,.12);
    padding:2px;
}

.hp-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#8fd17b,#e6f6dc);
    transition:.25s;
}

.enemy .hp-fill{
    background:linear-gradient(90deg,#e76b6b,#ffb0a8);
}

.arena-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:16px;
    text-align:center;
}

.round{
    font-size:11px;
    letter-spacing:3px;
    color:#7c8792;
}

#arenaTimer{
    font-size:25px;
    font-weight:1000;
}

.fighter{
    position:absolute;
    bottom:29%;
    width:150px;
    height:280px;
    z-index:8;
    transition:left .35s, right .35s, transform .15s;
}

.player-fighter{
    left:18%;
}

.enemy-fighter{
    right:18%;
}

.fighter-body{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:72px;
    height:170px;
    filter:drop-shadow(0 018px var(--fighter-color));
}

.f-head{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#020202;
    left:12px;
    top:0;
    box-shadow:0 0 10px rgba(255,255,255,.06);
}

.f-torso{
    position:absolute;
    width:67px;
    height:105px;
    left:2px;
    top:40px;
    background:#020202;
    clip-path:polygon(25% 0,75% 0,100% 20%,80% 100%,20% 100%,0 20%);
}

.f-leg1,.f-leg2{
    position:absolute;
    width:23px;
    height:80px;
    background:#020202;
    top:132px;
    border-radius:15px;
}

.f-leg1{left:12px;transform:rotate(8deg)}
.f-leg2{right:12px;transform:rotate(-8deg)}

.f-arm1,.f-arm2{
    position:absolute;
    width:19px;
    height:105px;
    background:#020202;
    top:45px;
    border-radius:14px;
    transform-origin:top center;
}

.f-arm1{left:-8px;transform:rotate(18deg)}
.f-arm2{right:-8px;transform:rotate(-18deg)}

.enemy-fighter .f-arm1{
    transform:rotate(-18deg);
}

.enemy-fighter .f-arm2{
    transform:rotate(18deg);
}

.shadow-aura{
    position:absolute;
    width:140px;
    height:60px;
    left:5px;
    bottom:0;
    border-radius:50%;
    background:radial-gradient(ellipse,var(--fighter-color),transparent 70%);
    opacity:.25;
    filter:blur(10px);
}

.nameplate{
    position:absolute;
    bottom:-32px;
    width:100%;
    text-align:center;
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
}

.controls{
    position:absolute;
    z-index:30;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(800px,94vw);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.skill{
    min-height:70px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(7,9,12,.86);
    border-radius:12px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:.15s;
}

.skill:hover{
    border-color:rgba(255,255,255,.35);
    transform:translateY(-2px);
}

.skill:active{
    transform:scale(.96);
}

.skill-index{
    position:absolute;
    top:7px;
    left:8px;
    color:#6e7984;
    font-size:10px;
}

.skill-name{
    padding:22px 7px 4px;
    font-weight:900;
    font-size:12px;
}

.skill-hint{
    color:#65717c;
    font-size:9px;
}

.cooldown{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:1000;
}

#fatalityButton{
    position:absolute;
    z-index:40;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    display:none;
    background:#5d0b0b;
    border:1px solid #ff5757;
    box-shadow:0 0 30px rgba(255,40,40,.2);
}

.combo{
    position:absolute;
    z-index:25;
    right:8%;
    top:35%;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
}

.combo.show{
    animation:comboIn .65s forwards;
}

.combo-number{
    font-size:48px;
    font-weight:1000;
}

.combo-text{
    font-size:11px;
    letter-spacing:4px;
    color:#aab5c0;
}
