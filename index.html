<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dota Draft Arena</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#090d13;
    color:#f4f5f7;
    font-family:Arial,system-ui,sans-serif;
}

button,input{font:inherit}

button{
    border:0;
    cursor:pointer;
    color:white;
}

.screen{
    display:none;
    min-height:100vh;
    padding:25px 17px 35px;
    max-width:760px;
    margin:auto;
}

.screen.active{
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:75px;
    text-align:center;
    margin-top:65px;
}

h1{
    text-align:center;
    letter-spacing:2px;
}

h2{
    margin-top:10px;
}

.muted{
    color:#8b96a4;
    text-align:center;
}

.primary{
    background:linear-gradient(135deg,#ed6330,#a82d18);
    padding:16px;
    border-radius:14px;
    font-weight:bold;
    margin-top:18px;
}

.big{
    font-size:17px;
    margin-top:35px;
}

.ghost,.back{
    background:none;
    color:#9ca8b5;
    padding:13px;
}

.mode,.difficulty{
    background:#111821;
    border:1px solid #28333e;
    border-radius:16px;
    padding:17px;
    margin:8px 0;
    text-align:left;
}

.mode{
    display:flex;
    gap:14px;
    align-items:center;
}

.mode.selected,.difficulty.selected{
    border-color:#df542a;
}

.mode-icon{
    font-size:35px;
}

.mode h3{
    margin:0 0 5px;
}

.mode p,.difficulty span{
    color:#8d98a5;
    font-size:13px;
    margin:0;
}

.locked{
    opacity:.45;
}

.difficulty{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.draft-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.draft-head .back{
    font-size:25px;
}

.phase{
    color:#e45b31;
    font-size:12px;
    font-weight:bold;
}

.timer{
    margin-left:auto;
    background:#151c24;
    border:1px solid #303b47;
    border-radius:11px;
    padding:10px 13px;
    font-weight:bold;
}

.teams{
    display:grid;
    grid-template-columns:1fr 35px 1fr;
    gap:7px;
    align-items:center;
    margin:17px 0;
}

.team{
    background:#101720;
    border:1px solid #27323d;
    border-radius:14px;
    padding:10px;
}

.player{
    border-color:#315b88;
}

.bot{
    border-color:#813d38;
}

.team-title{
    font-weight:bold;
    font-size:13px;
    margin-bottom:7px;
}

.slots{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
}

.slot{
    aspect-ratio:1;
    background:#1a232c;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#65717e;
}

.slot img,.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.vs{
    text-align:center;
    color:#697582;
    font-weight:bold;
}

.bans{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.banbox{
    background:#0e151c;
    border-radius:11px;
    padding:9px;
    color:#8994a1;
    font-size:11px;
}

.banlist{
    display:flex;
    gap:5px;
    margin-top:6px;
}

.ban{
    width:38px;
    height:38px;
    border-radius:6px;
    overflow:hidden;
}

.ban img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(1);
}

.search{
    width:100%;
    background:#111821;
    color:white;
    border:1px solid #293540;
    border-radius:12px;
    padding:13px;
    margin-top:15px;
    outline:none;
}

.heroes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:9px;
    max-height:47vh;
    overflow:auto;
}

.hero{
    position:relative;
    aspect-ratio:1;
    padding:0;
    background:#151e27;
    border:1px solid #293540;
    border-radius:8px;
    overflow:hidden;
}

.hero-name{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:16px 3px 4px;
    background:linear-gradient(transparent,#000d);
    font-size:9px;
    font-weight:bold;
}

.result-icon{
    text-align:center;
    font-size:65px;
    margin-top:45px;
}

.score{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:25px 0 12px;
}

.score div{
    background:#111821;
    border:1px solid #293540;
    border-radius:14px;
    text-align:center;
    padding:15px;
}

.score small{
    color:#8c97a4;
}

.score b{
    display:block;
    font-size:30px;
    margin-top:4px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.stat{
    background:#111821;
    padding:12px;
    border-radius:10px;
}

.stat span{
    color:#8d98a5;
    font-size:12px;
}

.stat b{
    float:right;
}

.reason{
    background:#111821;
    border-left:3px solid #e45a30;
    border-radius:8px;
    padding:13px;
    margin-top:10px;
    font-size:13px;
    line-height:1.4;
}
</style>
</head>

<body>

<!-- ГЛАВНОЕ МЕНЮ -->

<section id="home" class="screen active">

<div class="logo">⚔️</div>

<h1>DOTA DRAFT</h1>

<p class="muted">Draft Arena</p>

<button class="primary big" onclick="show('modes')">
🎮 НАЧАТЬ ИГРУ
</button>

<button class="ghost" onclick="show('profile')">
👤 Профиль
</button>

</section>

<!-- РЕЖИМЫ -->

<section id="modes" class="screen">

<button class="back" onclick="show('home')">‹ Назад</button>

<h2>НАЧАТЬ ИГРУ</h2>

<div class="mode selected">

<div class="mode-icon">🤖</div>

<div>
<h3>Против ИИ</h3>
<p>Сразись с искусственным интеллектом.</p>
</div>

</div>

<div class="mode locked">

<div class="mode-icon">👥</div>

<div>
<h3>Против игрока</h3>
<p>Скоро</p>
</div>

</div>

<button class="primary" onclick="show('difficulty')">
ПРОДОЛЖИТЬ
</button>

</section>

<!-- СЛОЖНОСТЬ -->

<section id="difficulty" class="screen">

<button class="back" onclick="show('modes')">‹ Назад</button>

<h2>СЛОЖНОСТЬ ИИ</h2>

<button class="difficulty selected" onclick="setDifficulty('easy',this)">

<b>🟢 Новичок</b>

<span>
ИИ выбирает сильных героев, но иногда ошибается.
</span>

</button>

<button class="difficulty" onclick="setDifficulty('normal',this)">

<b>🟡 Опытный</b>

<span>
ИИ учитывает синергию и контрпики.
</span>

</button>

<button class="difficulty locked">

<b>🔴 Immortal</b>

<span>Скоро</span>

</button>

<button class="primary" onclick="startGame()">
НАЧАТЬ ДРАФТ
</button>

</section>

<!-- ДРАФТ -->

<section id="draft" class="screen">

<div class="draft-head">

<button class="back" onclick="show('difficulty')">‹</button>

<div>

<div id="phase" class="phase">BAN PHASE</div>

<b id="turn">ТВОЙ ХОД</b>

</div>

<div id="timer" class="timer">20</div>

</div>

<div class="teams">

<div class="team player">

<div class="team-title">
🔵 ТЫ
</div>

<div id="playerSlots" class="slots"></div>

</div>

<div class="vs">VS</div>

<div class="team bot">

<div class="team-title">
🔴 ИИ
</div>

<div id="botSlots" class="slots"></div>

</div>

</div>

<div class="bans">

<div class="banbox">

ТВОИ БАНЫ

<div id="playerBans" class="banlist"></div>

</div>

<div class="banbox">

БАНЫ ИИ

<div id="botBans" class="banlist"></div>

</div>

</div>

<input
id="search"
class="search"
placeholder="🔎 Найти героя..."
oninput="renderHeroes()"
>

<div id="heroes" class="heroes"></div>

</section>

<!-- РЕЗУЛЬТАТ -->

<section id="result" class="screen">

<div id="resultIcon" class="result-icon">🏆</div>

<h1 id="resultTitle">ПОБЕДА</h1>

<p id="resultText" class="muted"></p>

<div class="score">

<div>

<small>🔵 ТЫ</small>

<b id="myScore">0</b>

</div>

<div>

<small>🔴 ИИ</small>

<b id="aiScore">0</b>

</div>

</div>

<div id="stats" class="stats"></div>

<div id="reason" class="reason"></div>

<button class="primary big" onclick="startGame()">
🔄 НОВЫЙ ДРАФТ
</button>

<button class="ghost" onclick="show('home')">
⌂ Главное меню
</button>

</section>

<!-- ПРОФИЛЬ -->

<section id="profile" class="screen">

<button class="back" onclick="show('home')">
‹ Назад
</button>

<h2>ПРОФИЛЬ</h2>

<div class="mode">

<div class="mode-icon">⚔️</div>

<div>

<h3 id="playerName">Игрок</h3>

<p>
Сыграно: <b id="games">0</b>

Побед: <b id="wins">0</b>
</p>

</div>

</div>

</section>

<script>

const tg=window.Telegram?.WebApp;

if(tg){
tg.ready();
tg.expand();
}

/* ГЕРОИ */

const heroes=[

["Axe",8,["Juggernaut","Phantom Assassin"]],
["Juggernaut",9,["Axe","Tidehunter"]],
["Phantom Assassin",9,["Crystal Maiden"]],
["Drow Ranger",8,["Timbersaw"]],
["Sven",8,["Phantom Assassin"]],
["Luna",8,["Anti-Mage"]],
["Anti-Mage",8,["Luna","Storm Spirit"]],
["Faceless Void",9,["Phantom Assassin"]],
["Slark",8,["Crystal Maiden"]],
["Wraith King",8,["Anti-Mage"]],

["Magnus",9,["Drow Ranger"]],
["Tidehunter",8,["Juggernaut"]],
["Timbersaw",8,["Drow Ranger"]],
["Mars",8,["Phantom Assassin"]],
["Centaur Warrunner",7,["Slark"]],
["Bristleback",8,["Juggernaut"]],
["Underlord",8,["Phantom Assassin"]],

["Crystal Maiden",8,["Juggernaut","Sven","Luna"]],
["Lion",8,["Phantom Assassin"]],
["Shadow Shaman",8,["Slark"]],
["Ogre Magi",8,["Juggernaut","Phantom Assassin"]],
["Vengeful Spirit",7,["Drow Ranger"]],
["Jakiro",8,["Faceless Void"]],
["Earthshaker",8,["Faceless Void","Magnus"]],
["Rubick",8,["Tidehunter","Magnus"]],
["Disruptor",8,["Faceless Void"]],
["Witch Doctor",7,["Faceless Void"]],
["Dazzle",8,["Juggernaut","Phantom Assassin"]],
["Oracle",8,["Juggernaut","Phantom Assassin"]],

["Lina",9,["Mars","Tidehunter"]],
["Zeus",8,["Tidehunter"]],
["Storm Spirit",8,["Anti-Mage"]],
["Invoker",9,["Faceless Void"]],
["Queen of Pain",8,["Axe"]],
["Puck",8,["Faceless Void"]],
["Tinker",7,["Axe"]],
["Shadow Fiend",8,["Axe"]],
["Sniper",8,["Storm Spirit"]],
["Razor",8,["Axe"]],
["Lifestealer",8,["Ogre Magi"]],
["Ursa",9,["Ogre Magi"]],
["Terrorblade",9,["Axe"]],
["Riki",7,["Dazzle"]],
["Pudge",6,["Anti-Mage"]],
["Bounty Hunter",7,["Lina"]],
["Clockwerk",8,["Lina"]],
["Earth Spirit",8,["Lina"]],
["Treant Protector",8,["Drow Ranger"]],
["Abaddon",8,["Juggernaut"]],
["Omniknight",7,["Phantom Assassin"]]

].map(x=>({
name:x[0],
power:x[1],
counters:x[2]
}));

function image(name){

let slug=name
.toLowerCase()
.replace(/[^a-z0-9]+/g,"_")
.replace(/^_|_$/g,"");

return "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/"+slug+".png";

}

/* СОСТОЯНИЕ */

let difficulty="easy";

let game;

let timer;

function show(id){

document
.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

}

function setDifficulty(d,b){

if(b.classList.contains("locked"))return;

difficulty=d;

document
.querySelectorAll(".difficulty")
.forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");

}

function startGame(){

game={

phase:"ban",

turn:"player",

playerBans:[],
botBans:[],

playerPicks:[],
botPicks:[],

available:heroes.map(x=>x.name)

};

show("draft");

render();

startTimer();

}

function render(){

document.getElementById("phase").textContent=
game.phase==="ban"?"BAN PHASE":"PICK PHASE";

document.getElementById("turn").textContent=
game.turn==="player"?"ТВОЙ ХОД":"ИИ ДУМАЕТ...";

renderTeam(
"playerSlots",
game.playerPicks
);

renderTeam(
"botSlots",
game.botPicks
);

renderBans(
"playerBans",
game.playerBans
);

renderBans(
"botBans",
game.botBans
);

renderHeroes();

}

function renderTeam(id,list){

let box=document.getElementById(id);

box.innerHTML="";

for(let i=0;i<5;i++){

let slot=document.createElement("div");

slot.className="slot";

if(list[i]){

slot.innerHTML=
`<img src="${image(list[i])}">`;

}else{

slot.textContent="—";

}

box.appendChild(slot);

}

}

function renderBans(id,list){

let box=document.getElementById(id);

box.innerHTML="";

list.forEach(n=>{

let d=document.createElement("div");

d.className="ban";

d.innerHTML=
`<img src="${image(n)}">`;

box.appendChild(d);

});

}

function renderHeroes(){

let q=document
.getElementById("search")
.value
.toLowerCase();

let box=document.getElementById("heroes");

box.innerHTML="";

game.available

.filter(n=>n.toLowerCase().includes(q))

.forEach(n=>{

let b=document.createElement("button");

b.className="hero";

b.innerHTML=
`
<img src="${image(n)}">

<div class="hero-name">
${n}
</div>
`;

b.onclick=()=>choose(n);

box.appendChild(b);

});

}

/* ХОД ИГРОКА */

function choose(name){

if(game.turn!=="player")return;

game.available=
game.available.filter(x=>x!==name);

if(game.phase==="ban"){

game.playerBans.push(name);

}else{

game.playerPicks.push(name);

}

if(game.phase==="ban"){

if(
game.playerBans.length+
game.botBans.length>=6
){

game.phase="pick";

game.turn="player";

render();

startTimer();

return;

}

}else{

if(
game.playerPicks.length+
game.botPicks.length>=10
){

finish();

return;

}

}

game.turn="bot";

render();

clearInterval(timer);

setTimeout(botMove,700);

}

/* ИИ */

function botMove(){

if(game.phase==="ban"){

botBan();

}else{

botPick();

}

if(
game.phase==="ban" &&
game.playerBans.length+
game.botBans.length>=6
){

game.phase="pick";

}

if(
game.phase==="pick" &&
game.playerPicks.length+
game.botPicks.length>=10
){

finish();

return;

}

game.turn="player";

render();

startTimer();

}

function botBan(){

let list=game.available.map(n=>
heroes.find(h=>h.name===n)
);

let pick;

if(difficulty==="easy"){

pick=list[
Math.floor(Math.random()*list.length)
];

}else{

pick=[...list].sort((a,b)=>{

let sa=a.power;

let sb=b.power;

game.playerPicks.forEach(p=>{

if(a.counters.includes(p))sa+=5;

if(b.counters.includes(p))sb+=5;

});

return sb-sa;

})[0];

}

game.botBans.push(pick.name);

game.available=
game.available.filter(n=>n!==pick.name);

}

function botPick(){

let list=game.available.map(n=>
heroes.find(h=>h.name===n)
);

let pick;

if(difficulty==="easy"){

list.sort((a,b)=>b.power-a.power);

pick=list[
Math.floor(Math.random()*Math.min(7,list.length))
];

}else{

pick=[...list].sort((a,b)=>{

let sa=a.power;

let sb=b.power;

game.playerPicks.forEach(p=>{

if(a.counters.includes(p))sa+=6;

if(b.counters.includes(p))sb+=6;

});

game.botPicks.forEach(p=>{

if(a.counters.includes(p))sa+=2;

if(b.counters.includes(p))sb+=2;

});

return sb-sa;

})[0];

}

game.botPicks.push(pick.name);

game.available=
game.available.filter(n=>n!==pick.name);

}

/* ТАЙМЕР */

function startTimer(){

clearInterval(timer);

let t=20;

document.getElementById("timer").textContent=t;

timer=setInterval(()=>{

t--;

document.getElementById("timer").textContent=t;

if(t<=0){

clearInterval(timer);

if(game.turn==="player"){

choose(
game.available[
Math.floor(Math.random()*game.available.length)
]
);

}

}

},1000);

}

/* ОЦЕНКА */

function score(team,enemy){

let power=0;

let counters=0;

team.forEach(n=>{

let h=heroes.find(x=>x.name===n);

power+=h.power;

enemy.forEach(e=>{

if(h.counters.includes(e))
counters+=2;

});

});

let result=
(power/team.length)+counters;

return Math.min(
10,
Math.round(result*10)/10
);

}

/* РЕЗУЛЬТАТ */

function finish(){

clearInterval(timer);

let my=score(
game.playerPicks,
game.botPicks
);

let ai=score(
game.botPicks,
game.playerPicks
);

let win=my>ai;

document.getElementById("resultIcon")
.textContent=
win?"🏆":my<ai?"💀":"🤝";

document.getElementById("resultTitle")
.textContent=
win?"ПОБЕДА":my<ai?"ПОРАЖЕНИЕ":"НИЧЬЯ";

document.getElementById("resultText")
.textContent=
`Твой драфт ${my} / 10 • Драфт ИИ ${ai} / 10`;

document.getElementById("myScore")
.textContent=my;

document.getElementById("aiScore")
.textContent=ai;

document.getElementById("stats").innerHTML=`

<div class="stat">
<span>⚔️ Сила состава</span>
<b>${Math.min(10,my)}</b>
</div>

<div class="stat">
<span>🎯 Контрпики</span>
<b>${Math.min(10,Math.round(my))}</b>
</div>

<div class="stat">
<span>🔗 Синергия</span>
<b>${Math.min(10,Math.round(my*.9))}</b>
</div>

<div class="stat">
<span>📈 Масштабирование</span>
<b>${Math.min(10,Math.round(my*.95))}</b>
</div>

`;

document.getElementById("reason")
.textContent=
win
?"🧠 Ты собрал более сильный драфт. ИИ не смог полностью закрыть твою стратегию."
:"🧠 ИИ лучше использовал контрпики. Попробуй изменить первые пики и баны.";

let s=JSON.parse(
localStorage.getItem("draftStats")||
'{"games":0,"wins":0}'
);

s.games++;

if(win)s.wins++;

localStorage.setItem(
"draftStats",
JSON.stringify(s)
);

show("result");

}

let stats=JSON.parse(
localStorage.getItem("draftStats")||
'{"games":0,"wins":0}'
);

document.getElementById("games").textContent=stats.games;

document.getElementById("wins").textContent=stats.wins;

if(tg?.initDataUnsafe?.user){

document.getElementById("playerName")
.textContent=
tg.initDataUnsafe.user.first_name||
"Игрок";

}

</script>

</body>
</html>
